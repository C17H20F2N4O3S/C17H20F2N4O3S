name: Metrics
on:
  # every 6 hours, so the calendar and streak stay current
  schedule: [{cron: "17 */6 * * *"}]
  # run by hand from the Actions tab
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # personal access token, no scopes needed; saved as a repository secret, never in this file
          token: ${{ secrets.METRICS_TOKEN }}
          user: omarvelously
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
